# ============================================================
#  命令行部署专用（docker compose up --build）
# ============================================================
#  ⚠️ 1Panel 用户不要用这一份！
#  1Panel 创建编排时会自己先做镜像预拉取，pull_policy 对它无效，
#  且老版本 Compose 不认 pull_policy 字段会直接报错。
#  → 1Panel 请用同目录的 docker-compose.run.yml（先构建镜像再起）。
#
#  本文件适用：SSH 命令行 docker compose up -d --build 的部署方式，
#  build 段由命令行 --build 显式触发，pull_policy: build 防的是
#  compose 去 Docker Hub 拉本地私有镜像。
#
#  反代交给外部（WAF / nginx），这里不碰域名、证书，对外只暴露 3000。
# ============================================================

services:
  app:
    # 构建上下文 = 源码目录。
    build:
      context: /opt/classroom-interactive
      dockerfile: Dockerfile

    image: classroom-interactive:1.0.0

    # 命令行跑 docker compose up（不带 --build）时，compose 发现本地没有
    # classroom-interactive:1.0.0 会去 Docker Hub 拉 → pull access denied。
    # pull_policy: build = 这个镜像只靠本地构建，永远不去远端拉。
    pull_policy: build

    container_name: classroom-app
    restart: unless-stopped

    ports:
      # 供外部 WAF 回源。若 WAF 装在同一台机器上，改成
      #   - "127.0.0.1:3000:3000"
      # 这样只有本机能访问，公网流量强制走 WAF，绕不过去。
      - "3000:3000"

    environment:
      PORT: "3000"
      TZ: Asia/Shanghai

      # 留空 = 按 X-Forwarded-Host / Host 自动推断。
      # 部署后打开 https://你的域名/healthz，看 qrBase 字段——
      # 那就是学生扫码真正打开的地址。若不是你的 https 域名，
      # 在这里填 PUBLIC_BASE: "https://你的域名"，重启容器即可（不用重新构建）。
      PUBLIC_BASE: ""

      DISABLE_ROOM_LIST: "1"

    volumes:
      # 必须用命名卷。挂宿主目录（如 /opt/classroom-interactive/data）会因
      # 容器以 node(uid 1000) 运行而权限不足，启动时直接 EACCES 崩溃。
      - classroom-data:/app/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  classroom-data:
