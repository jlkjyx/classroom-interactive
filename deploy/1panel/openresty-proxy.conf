# 1Panel 网站反向代理配置片段
#
# 用法（推荐走 UI）：
#   1Panel → 网站 → 点你的域名 → 反向代理 → 创建
#   代理地址填 http://127.0.0.1:3000
#   打开「支持 WebSocket」开关（新版 1Panel 有此选项）
#
# 如果你的 1Panel 版本没有 WebSocket 开关，或开关不生效，就用下面的内容：
#   1Panel → 网站 → 配置 → 反向代理 配置文件
#   把下面整段粘进去（这是 location 级别的片段，不要加 server{} 外层）
#
# 为什么必须配 WebSocket：
#   Socket.IO 优先用 WebSocket，升级失败会退化成 HTTP 长轮询。轮询也能用，
#   但弹幕、抢答这类"谁先谁后"的场景会明显发飘，延迟从几十毫秒变成几百毫秒。

proxy_http_version 1.1;

# WebSocket 升级 —— 缺这两行，实时性会明显变差
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

# 传递真实信息，服务端据此生成正确的二维码链接
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# 长连接超时：投票、弹幕全程保持连接，默认 60s 会频繁断连重连
proxy_read_timeout  3600s;
proxy_send_timeout  3600s;

# 关闭缓冲，否则大屏的票数更新会被攒着一起发，看起来一顿一顿的
proxy_buffering     off;

# 学生端是手机，别让 nginx 把请求排队太久
proxy_connect_timeout 10s;

client_max_body_size 2m;
